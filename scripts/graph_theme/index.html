<!doctype html>
<meta charset="utf-8">
<title>graph canvas theme</title>
<style>
  :root {
    --bg: #1d2021; --panel: #282828; --line: #3c3836;
    --fg: #ebdbb2; --dim: #a89984; --accent: #fabd2f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 "Anonymous Pro", ui-monospace, Menlo, Consolas, monospace;
    display: grid; grid-template-columns: 360px 1fr; height: 100vh;
  }
  aside { overflow-y: auto; border-right: 1px solid var(--line); padding: 12px; }
  main { display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 12px; padding: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 18px 0 8px; font-weight: normal; }
  h2:first-child { margin-top: 0; }
  .row { display: grid; grid-template-columns: 1fr 34px 62px;
         gap: 8px; align-items: center; margin-bottom: 4px; }
  .row label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               cursor: pointer; }
  .row.changed label { color: var(--accent); }
  .swatch { width: 34px; height: 24px; border: 1px solid var(--line);
            border-radius: 3px; cursor: pointer; }
  .swatch.open { border-color: var(--accent); }
  /* The picker is a panel in the list, not a modal: the canvas stays
     visible while you drag, which is the whole point of tuning against it. */
  .picker { display: none; padding: 6px 0 10px 0; }
  .picker.open { display: block; }
  .picker .track { display: grid; grid-template-columns: 14px 1fr 46px;
                   gap: 6px; align-items: center; margin-bottom: 3px; }
  .picker .track span { color: var(--dim); font-size: 11px; }
  .picker input[type=range] { -webkit-appearance: none; appearance: none;
                              height: 14px; border-radius: 3px;
                              border: 1px solid var(--line); }
  .picker input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 8px; height: 18px; border-radius: 2px;
    background: var(--fg); border: 1px solid #000; cursor: ew-resize; }
  .picker input[type=range]::-moz-range-thumb {
    width: 8px; height: 18px; border-radius: 2px;
    background: var(--fg); border: 1px solid #000; cursor: ew-resize; }
  .hexrow { display: grid; grid-template-columns: 14px 1fr; gap: 6px;
            align-items: center; margin-top: 4px; }
  input[type=number], input[type=text] {
    width: 100%; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px;
    font: inherit; font-size: 12px;
  }
  .srow { display: grid; grid-template-columns: 1fr 1fr 62px; gap: 8px;
          align-items: center; margin-bottom: 4px; }
  input[type=range] { width: 100%; }
  img { border: 1px solid var(--line); border-radius: 4px; max-width: 100%; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; background: var(--panel); color: var(--fg);
           border: 1px solid var(--line); border-radius: 3px;
           padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #out { width: 100%; max-width: 820px; height: 200px; background: #161819;
         color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
         padding: 8px; font: inherit; font-size: 12px; display: none; }
  .hint { color: var(--dim); font-size: 12px; }
</style>

<aside>
  <div class="bar" style="margin-bottom:12px">
    <button id="reset">Reset to current</button>
    <button id="lib">Library defaults</button>
    <button id="export">Export</button>
  </div>
  <div id="host"></div>
  <div id="colours"></div>
  <h2>shading</h2>
  <div id="scalars"></div>
</aside>

<main>
  <img id="view" width="820" height="560" alt="canvas preview">
  <div class="hint" id="status">loading…</div>
  <textarea id="out" spellcheck="false"></textarea>
</main>

<script>
const $ = (s) => document.querySelector(s);
let BASE = null, LIB = null, COLOURS = [], SCALARS = [], theme = {};
let HOST_BASE = null, HOST_ORDER = [], host = {};

const to255 = (v) => Math.max(0, Math.min(255, Math.round(v * 255)));
const hex = (rgba) =>
  "#" + [0, 1, 2].map((i) => to255(rgba[i]).toString(16).padStart(2, "0")).join("");
const fromHex = (h, a) => [
  parseInt(h.slice(1, 3), 16) / 255,
  parseInt(h.slice(3, 5), 16) / 255,
  parseInt(h.slice(5, 7), 16) / 255,
  a,
];

// HSV rather than raw channels: tuning a fill means moving its lightness or
// its saturation while holding the hue, and three RGB sliders cannot do that
// without changing all of them.
function rgb2hsv(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
    else if (mx === g) h = ((b - r) / d + 2) / 6;
    else h = ((r - g) / d + 4) / 6;
  }
  return [h, mx ? d / mx : 0, mx];
}
function hsv2rgb(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  const tbl = [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]];
  return tbl[i % 6];
}

let pending = false, again = false;
async function draw() {
  if (pending) { again = true; return; }
  pending = true;
  try {
    const r = await fetch("/render", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ theme, host, w: 820, h: 560 }),
    });
    const { png } = await r.json();
    $("#view").src = "data:image/png;base64," + png;
    $("#status").textContent = "";
  } catch (e) {
    $("#status").textContent = "render failed: " + e;
  }
  pending = false;
  if (again) { again = false; draw(); }
}

function markChanged(name, node) {
  const a = JSON.stringify(theme[name]), b = JSON.stringify(BASE[name]);
  node.classList.toggle("changed", a !== b);
}

function colourField(name, container, model, base) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML =
    `<label title="${name}">${name}</label>` +
    `<div class="swatch"></div>` +
    `<input type="number" min="0" max="1" step="0.05" value="${model[name][3]}">`;
  const [label, swatch, alpha] = row.children;

  const panel = document.createElement("div");
  panel.className = "picker";
  panel.innerHTML =
    ["h", "s", "v"].map((ch) =>
      `<div class="track"><span>${ch}</span>` +
      `<input type="range" min="0" max="1" step="0.002" data-ch="${ch}">` +
      `<input type="number" min="0" max="1" step="0.01" data-ch="${ch}"></div>`
    ).join("") +
    `<div class="hexrow"><span>#</span><input type="text" maxlength="7"></div>`;
  const ranges = {}, nums = {};
  for (const el of panel.querySelectorAll("input[type=range]")) ranges[el.dataset.ch] = el;
  for (const el of panel.querySelectorAll("input[type=number]")) nums[el.dataset.ch] = el;
  const hexIn = panel.querySelector("input[type=text]");

  // Every widget writes the model and redraws immediately -- no confirm step,
  // because the render IS the feedback and a button between them breaks it.
  function paint() {
    const c = model[name];
    swatch.style.background = `rgb(${to255(c[0])},${to255(c[1])},${to255(c[2])})`;
    const [h, sa, v] = rgb2hsv(c[0], c[1], c[2]);
    ranges.h.value = nums.h.value = h.toFixed(3);
    ranges.s.value = nums.s.value = sa.toFixed(3);
    ranges.v.value = nums.v.value = v.toFixed(3);
    hexIn.value = hex(c);
    // The tracks show where they lead, so a hue is picked by eye.
    const stops = [];
    for (let i = 0; i <= 6; i++) {
      const [r, g, b] = hsv2rgb(i / 6, Math.max(sa, 0.85), Math.max(v, 0.85));
      stops.push(`rgb(${to255(r)},${to255(g)},${to255(b)})`);
    }
    ranges.h.style.background = `linear-gradient(90deg, ${stops.join(",")})`;
    const dull = hsv2rgb(h, 0, v), full = hsv2rgb(h, 1, v);
    ranges.s.style.background =
      `linear-gradient(90deg, rgb(${to255(dull[0])},${to255(dull[1])},${to255(dull[2])}),` +
      ` rgb(${to255(full[0])},${to255(full[1])},${to255(full[2])}))`;
    const lit = hsv2rgb(h, sa, 1);
    ranges.v.style.background =
      `linear-gradient(90deg, #000, rgb(${to255(lit[0])},${to255(lit[1])},${to255(lit[2])}))`;
    row.classList.toggle(
      "changed", JSON.stringify(model[name]) !== JSON.stringify(base[name]));
  }

  function commit(rgb) {
    model[name] = [rgb[0], rgb[1], rgb[2], parseFloat(alpha.value)];
    paint();
    draw();
  }
  for (const ch of ["h", "s", "v"]) {
    const push = (src) => {
      const v = Math.max(0, Math.min(1, parseFloat(src.value) || 0));
      const cur = rgb2hsv(...model[name].slice(0, 3));
      const next = { h: cur[0], s: cur[1], v: cur[2] };
      next[ch] = v;
      commit(hsv2rgb(next.h, next.s, next.v));
    };
    ranges[ch].addEventListener("input", () => push(ranges[ch]));
    nums[ch].addEventListener("input", () => push(nums[ch]));
  }
  hexIn.addEventListener("input", () => {
    if (/^#[0-9a-fA-F]{6}$/.test(hexIn.value)) {
      commit(fromHex(hexIn.value, 1).slice(0, 3));
    }
  });
  alpha.addEventListener("input", () => commit(model[name].slice(0, 3)));

  const toggle = () => {
    const open = panel.classList.toggle("open");
    swatch.classList.toggle("open", open);
  };
  swatch.addEventListener("click", toggle);
  label.addEventListener("click", toggle);

  paint();
  container.appendChild(row);
  container.appendChild(panel);
}

function buildColours() {
  // The host's own decisions first: these are the ones that say what a
  // shaderbox ROW is -- an engine value, a script-driven one, a selection
  // -- and the library has no field for any of them.
  const hostHost = $("#host");
  hostHost.innerHTML = "<h2>shaderbox roles</h2>";
  for (const name of HOST_ORDER) colourField(name, hostHost, host, HOST_BASE);
  const lib = $("#colours");
  lib.innerHTML = "<h2>library theme</h2>";
  for (const name of COLOURS) colourField(name, lib, theme, BASE);
}

function buildScalars() {
  const host = $("#scalars");
  host.innerHTML = "";
  for (const name of SCALARS) {
    const v = theme[name];
    const max = v > 1.5 ? Math.ceil(v * 2) : 1;
    const row = document.createElement("div");
    row.className = "srow";
    row.innerHTML =
      `<label title="${name}">${name}</label>` +
      `<input type="range" min="0" max="${max}" step="0.005" value="${v}">` +
      `<input type="number" step="0.005" value="${v}">`;
    const [, slider, num] = row.children;
    const apply = (source) => {
      theme[name] = parseFloat(source.value);
      slider.value = num.value = theme[name];
      markChanged(name, row);
      draw();
    };
    slider.addEventListener("input", () => apply(slider));
    num.addEventListener("input", () => apply(num));
    markChanged(name, row);
    host.appendChild(row);
  }
}

function load(values, hostValues) {
  theme = JSON.parse(JSON.stringify(values));
  host = JSON.parse(JSON.stringify(hostValues ?? HOST_BASE));
  buildColours();
  buildScalars();
  draw();
}

$("#reset").onclick = () => load(BASE, HOST_BASE);
$("#lib").onclick = () => load(LIB, HOST_BASE);
$("#export").onclick = () => {
  const hostChanged = HOST_ORDER.filter(
    (n) => JSON.stringify(host[n]) !== JSON.stringify(HOST_BASE[n]));
  const changed = COLOURS.filter(
    (n) => JSON.stringify(theme[n]) !== JSON.stringify(BASE[n]));
  const scal = SCALARS.filter((n) => theme[n] !== BASE[n]);
  const lines = [];
  if (hostChanged.length) {
    lines.push("# shaderbox/theme.py -- the host's own role colours");
    for (const n of hostChanged) {
      const c = host[n];
      lines.push(`    ${n}: tuple[float, float, float, float] = (` +
                 `${c.map((v) => v.toFixed(3)).join(", ")})`);
    }
    lines.push("");
  }
  if (changed.length) {
    lines.push("# theme_from(...) arguments -- paste into canvas_theme()");
    for (const n of changed) {
      const c = theme[n];
      lines.push(`    ${n}=(${c.map((v) => v.toFixed(3)).join(", ")}),`);
    }
  }
  if (scal.length) {
    lines.push("", "# shading scalars -- set on the Theme after theme_from()");
    for (const n of scal) lines.push(`    theme.${n} = ${theme[n].toFixed(3)}`);
  }
  const out = $("#out");
  out.value = lines.length ? lines.join("\n") : "nothing changed yet";
  out.style.display = "block";
  out.select();
};

fetch("/theme").then((r) => r.json()).then((d) => {
  BASE = d.current; LIB = d.library;
  COLOURS = d.colours; SCALARS = d.scalars;
  HOST_BASE = d.host; HOST_ORDER = d.hostOrder;
  load(BASE, HOST_BASE);
});
</script>
