target-version = "py312"
line-length = 88
extend-exclude = ["ai_docs/", "shaderbox/resources/editor/abi_probe.py"]

[lint]
# Cyrillic glyph data/docs legitimately contain Cyrillic letters (gen_glyphs.py).
allowed-confusables = ["А", "В", "Е", "К", "М", "Н", "О", "Р", "С", "Т", "Х", "а", "е", "о", "с"]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"scripts/agent_hub/generate.py" = ["RUF001"]

[lint.isort]
known-first-party = ["shaderbox"]
