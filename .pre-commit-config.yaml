exclude: ^(projects/|shaderbox/resources/emoji/emoji-test\.txt$|shaderbox/resources/editor/abi_probe\.py$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        args: [--line-length=88]

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        language: system
        types: [python]
        pass_filenames: false
        # NO path argument: a path on the command line OVERRIDES `[tool.pyright] include`, so
        # `pyright shaderbox` silently un-widens the checked set and the scripts go unchecked
        # while the gate stays green. Let the config decide what is checked.
        entry: uv run pyright
        verbose: true
