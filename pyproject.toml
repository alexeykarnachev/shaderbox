[project]
name = "shaderbox"
version = "0.29.0"
authors = [
    { name = "Alexey Karnachev", email = "alekseykarnachev@gmail.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# The CORE is what a host needs to open a themed window and render: the UI kit
# (`theme`, `ui_primitives`, `notifications`) and the document/render path. A
# dependency that only one feature needs lives in that feature's extra, so a
# project reusing the widgets does not install a chat client to get a button.
# `[all]` is what the app itself runs on and what `build.sh` bundles.
dependencies = [
    "glfw>=2.10.0",
    "loguru>=0.7.3",
    "moderngl>=5.12.0",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "platformdirs>=4.10.0",
    "pydantic>=2.13.4",
    "pyperclip>=1.11.0",
    "imgui-bundle>=1.92.801",
    "pyopengl>=3.1.10",
]

[project.optional-dependencies]
# Video encode/decode: the exporters and the video texture source.
video = [
    "imageio[ffmpeg]>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "opencv-python-headless>=4.11.0.86",
]
# The LLM copilot.
copilot = ["openai>=2.41.1"]
# Sticker-set upload.
telegram = ["python-telegram-bot>=22.8"]
# YouTube upload from the Share tab.
youtube = [
    "google-api-python-client>=2.197.0",
    "google-auth-oauthlib>=1.4.0",
]
# The code editor's language intelligence: Python completion and GLSL format.
editor = [
    "jedi>=0.20.0",
    "clang-format>=23.1.0",
    "ruff==0.15.17",
]
all = [
    "shaderbox[video,copilot,telegram,youtube,editor]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shaderbox"]
include = ["shaderbox/resources/**/*"]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pre-commit>=4.6.0",
    "ruff==0.15.17",
    "pytest>=9.1.0",
    "pytest-forked>=1.6.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# Research artifacts under ai_docs/ are preserved verbatim as evidence, not maintained as
# source -- reformatting them to project style would obscure what was actually run. The
# vendored ABI probe is upstream's bytes, compared byte-for-byte by the argtypes gate.
extend-exclude = ["ai_docs/", "shaderbox/resources/editor/abi_probe.py"]

[tool.ruff.lint]
# Cyrillic glyph data/docs legitimately contain Cyrillic letters (gen_glyphs.py).
allowed-confusables = ["А", "В", "Е", "К", "М", "Н", "О", "Р", "С", "Т", "Х", "а", "е", "о", "с"]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"scripts/agent_hub/generate.py" = ["RUF001"]  # Russian page copy trips the ambiguous-unicode check

[tool.ruff.lint.isort]
known-first-party = ["shaderbox"]

[tool.pytest.ini_options]
# -ra names every failed test in the trailing summary; xfail_strict makes an unexpected pass a
# failure rather than a quiet xpass.
addopts = "-ra"
testpaths = ["tests"]
# A per-test deadline, because a hung worker is otherwise UNBOUNDED: xdist waits forever on a
# node that died, and the run sat for 12 minutes behind one defunct worker while the other seven
# idled at 2% CPU. The slowest real test is ~6s, so 60s is ten times the worst case and can only
# fire on a hang. `thread` rather than the signal method: the signal one fires only in the main
# thread, which is not where a GL call blocks.
timeout = 60
timeout_method = "thread"
xfail_strict = true
# `make test` runs xdist with `--dist loadgroup`. Each module that drives real frames carries
# its OWN `xdist_group`, so no two of them share a process: the imgui font atlas is
# process-global and its GL texture is torn down with the App that built it, so a second
# frame-driving module gets `glTexSubImage2D` against a dead binding. Without the groups these
# tests are green only by luck of the worker split.
markers = ["xdist_group: pin a test to one xdist worker (see the gl_frames group)"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
# `scripts/` and `.claude/skills/` hold standalone helpers invoked by hand, never imported by
# `tests/` — so a package symbol they call could be renamed or deleted with every gate green.
# Three had accumulated that way (079 final review). They are checked here now.
include = ["shaderbox", "scripts", ".claude/skills", "dogfood"]
# The vendored ABI probe is upstream's bytes, compared byte-for-byte by
# tests/test_editor_ffi.py; house rules do not apply to it.
exclude = [
    "shaderbox/resources/editor/abi_probe.py",
    # Dogfood run artifacts: recorded copies of documents a model wrote during a run, kept as
    # evidence. They are data, not this repo's code, and several predate API changes on purpose.
    "scripts/dogfood/runs",
    # Three standalone scripts whose only findings are upstream-stub imprecision on working code:
    # `generate.py` imports through a runtime `sys.path` insert pyright cannot follow;
    # `drive.py` reads `__doc__`, typed optional though a module docstring is right there;
    # `verify_script_engine.py` lists `Image.getdata()`, whose stub understates the real sequence.
    "scripts/agent_hub/generate.py",
    "scripts/dogfood/drive.py",
    "scripts/dogfood/verify_script_engine.py",
]
# basic mode (default) — pyright over mypy here on purpose: fewer false positives,
# less friction. Tighten to "standard"/"strict" later if it earns it.
