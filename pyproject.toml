[project]
name = "shaderbox"
version = "0.29.0"
authors = [
    { name = "Alexey Karnachev", email = "alekseykarnachev@gmail.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# The CORE is what a host needs to open a themed window and render: the UI kit
# (`theme`, `ui_primitives`, `notifications`) and the document/render path. A
# dependency that only one feature needs lives in that feature's extra, so a
# project reusing the widgets does not install a chat client to get a button.
# `[all]` is what the app itself runs on and what `build.sh` bundles.
dependencies = [
    "glfw>=2.10.0",
    "loguru>=0.7.3",
    "moderngl>=5.12.0",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "platformdirs>=4.10.0",
    "pydantic>=2.13.4",
    "pyperclip>=1.11.0",
    "imgui-bundle>=1.92.801",
    "pyopengl>=3.1.10",
]

[project.optional-dependencies]
# Video encode/decode: the exporters and the video texture source.
video = [
    "imageio[ffmpeg]>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "opencv-python-headless>=4.11.0.86",
]
# The LLM copilot.
copilot = ["openai>=2.41.1"]
# Sticker-set upload.
telegram = ["python-telegram-bot>=22.8"]
# YouTube upload from the Share tab.
youtube = [
    "google-api-python-client>=2.197.0",
    "google-auth-oauthlib>=1.4.0",
]
# The code editor's language intelligence: Python completion and GLSL format.
editor = [
    "jedi>=0.20.0",
    "clang-format>=23.1.0",
    "ruff==0.15.17",
]
all = [
    "shaderbox[video,copilot,telegram,youtube,editor]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shaderbox"]
include = ["shaderbox/resources/**/*"]

[dependency-groups]
# The app runs on every extra; a default group is how a bare `uv sync` installs them.
app = ["shaderbox[all]"]
dev = [
    "pyright>=1.1.410",
    "pre-commit>=4.6.0",
    "ruff==0.15.17",
    "pytest>=9.1.0",
    "pytest-forked>=1.6.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["ai_docs/", "shaderbox/resources/editor/abi_probe.py"]

[tool.ruff.lint]
# Cyrillic glyph data/docs legitimately contain Cyrillic letters (gen_glyphs.py).
allowed-confusables = ["А", "В", "Е", "К", "М", "Н", "О", "Р", "С", "Т", "Х", "а", "е", "о", "с"]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"scripts/agent_hub/generate.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["shaderbox"]

[tool.pytest.ini_options]
# -ra names every failed test in the trailing summary; xfail_strict makes an unexpected pass a
# failure rather than a quiet xpass.
addopts = "-ra"
testpaths = ["tests"]
# A per-test deadline: xdist otherwise waits forever on a worker that hung. `thread`, since
# the signal method fires only in the main thread, which is not where a GL call blocks.
timeout = 60
timeout_method = "thread"
xfail_strict = true
# Each module that drives real frames carries its own `xdist_group`, so no two share a
# process: the imgui font atlas is process-global and dies with the App that built it.
markers = ["xdist_group: pin a test to one xdist worker (see the gl_frames group)"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["shaderbox", "scripts", ".claude/skills", "dogfood"]
exclude = [
    "shaderbox/resources/editor/abi_probe.py",
    "scripts/dogfood/runs",
    "scripts/agent_hub/generate.py",
    "scripts/dogfood/drive.py",
    "scripts/dogfood/verify_script_engine.py",
]

[tool.uv]
default-groups = ["app", "dev"]
