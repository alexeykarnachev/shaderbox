[project]
name = "shaderbox"
version = "0.30.1"
authors = [
    { name = "Alexey Karnachev", email = "alekseykarnachev@gmail.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# The CORE is what a host needs to open a themed window and render: the UI kit
# (`theme`, `ui_primitives`, `notifications`) and the document/render path. A
# dependency that only one feature needs lives in that feature's extra, so a
# project reusing the widgets does not install a chat client to get a button.
# `[all]` is what the app itself runs on and what `build.sh` bundles.
dependencies = [
    "glfw>=2.10.0",
    "loguru>=0.7.3",
    "moderngl>=5.12.0",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "platformdirs>=4.10.0",
    "pydantic>=2.13.4",
    "pyperclip>=1.11.0",
    "imgui-bundle>=1.92.801",
    "pyopengl>=3.1.10",
]

[project.optional-dependencies]
# Video encode/decode: the exporters and the video texture source.
video = [
    "imageio[ffmpeg]>=2.37.3",
    "opencv-python-headless>=4.11.0.86",
]
# The LLM copilot.
copilot = ["openai>=2.41.1"]
# Sticker-set upload.
telegram = ["python-telegram-bot>=22.8"]
# YouTube upload from the Share tab.
youtube = [
    "google-api-python-client>=2.197.0",
    "google-auth-oauthlib>=1.4.0",
]
# The code editor's language intelligence: Python completion and GLSL format.
editor = [
    "jedi>=0.20.0",
    "clang-format>=23.1.0",
    "ruff==0.15.17",
]
all = [
    "shaderbox[video,copilot,telegram,youtube,editor]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shaderbox"]
include = ["shaderbox/resources/**/*"]

[dependency-groups]
# The app runs on every extra; a default group is how a bare `uv sync` installs them.
app = ["shaderbox[all]"]
dev = [
    "pyright>=1.1.410",
    "pre-commit>=4.6.0",
    "ruff==0.15.17",
    "pytest>=9.1.0",
    "pytest-forked>=1.6.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]

[tool.uv]
default-groups = ["app", "dev"]
